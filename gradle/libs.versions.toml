[versions]
buildTools = "36.0.0"
compileSdk = "36"
# ⚠️ Update github action emulators ⚠️
targetSdk = "36"
minSdk = "26"

agp = "8.13.0"
kotlin = "2.2.10"
navigation = "2.9.3"
reveal = "4.0.0"
licenses = "5.1.0"
ktlint-compose = "0.4.27"
haze = "1.6.10"
logtag = "1.1.0"
lifecycle = "2.9.3"

gradle = "9.0.0"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
licenses-gradle-plugin = { module = "com.cmgapps:gradle-licenses-plugin", version.ref = "licenses" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.17.0" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version = "1.3.0" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version = "3.7.0" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.10.1" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version = "2025.08.01" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3-compose = { group = "androidx.compose.material3", name = "material3", version = "1.3.2" }
androidx-material3-theme = "com.google.android.material:material:1.12.0"
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment-compose", version.ref = "navigation" }
androidx-navigation-testing = { module = "androidx.navigation:navigation-testing", version.ref = "navigation" }
androidx-adaptive-navigation-android = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation-android", version = "1.1.0" }
androidx-compose-animation = "androidx.compose.animation:animation:1.9.3"
androidx-palette = "androidx.palette:palette:1.0.0"
androidx-webkit = { group = "androidx.webkit", name = "webkit", version = "1.14.0" }

junit-bom = { module = "org.junit:junit-bom", version = "5.13.4" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }

coil-compose = "io.coil-kt:coil-compose:2.7.0"

kotlinx-serialization-json = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
kotlinx-datetime = "org.jetbrains.kotlinx:kotlinx-datetime:0.7.1"
kotlinx-coroutines-test = "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"

ktlint-cli = "com.pinterest.ktlint:ktlint-cli:1.7.1"
# ⚠️ Also download the jar from the repo for CLI ⚠️
# https://github.com/mrmans0n/compose-rules/releases
ktlint-compose = { module = "io.nlopez.compose.rules:ktlint", version.ref = "ktlint-compose" }

reveal-core = { module = "com.svenjacobs.reveal:reveal-core", version.ref = "reveal" }
reveal-shapes = { module = "com.svenjacobs.reveal:reveal-shapes", version.ref = "reveal" }

haze-haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-materials = { module = "dev.chrisbanes.haze:haze-materials", version.ref = "haze" }

timber = "com.jakewharton.timber:timber:5.0.1"

molecule = "app.cash.molecule:molecule-runtime:2.1.0"

hamcrest = "org.hamcrest:hamcrest:3.0"

cmgapps-logtag-logtag = { module = "com.cmgapps.logtag:log-tag", version.ref = "logtag" }
cmgapps-logtag-processor = { module = "com.cmgapps.logtag:processor", version.ref = "logtag" }

ktor-bom = "io.ktor:ktor-bom:3.2.3"
ktor-client = { module = "io.ktor:ktor-client-okhttp" }
ktor-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation" }
ktor-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json" }

turbine = { module = "app.cash.turbine:turbine", version = "1.2.1" }

okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version = "5.1.0" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
jetbrainsKotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
versions = "com.github.ben-manes.versions:0.52.0"
paparazzi = "app.cash.paparazzi:2.0.0-alpha02"
licenses = { id = "com.cmgapps.licenses", version.ref = "licenses" }
ksp = "com.google.devtools.ksp:2.2.10-2.0.2"
